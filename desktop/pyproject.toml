[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-voice-assistant"
version = "2.0.0"
description = "A local-first macOS voice assistant powered by Ollama"
requires-python = ">=3.11"
dependencies = ["ollama>=0.6,<1", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
gui = ["PyQt6>=6.7,<7"]
voice = ["SpeechRecognition>=3.10,<4", "PyAudio>=0.2.14,<1"]
dev = ["pytest>=8,<9"]

[project.scripts]
nova = "nova_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["nova_assistant*"]

