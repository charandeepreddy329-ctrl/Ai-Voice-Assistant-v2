services:
  - type: web
    name: nova-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: compatible
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CHAT_MODEL
        sync: false
      - key: REASONING_MODEL
        sync: false
      - key: GLOBAL_REQUESTS_PER_MINUTE
        value: '60'
