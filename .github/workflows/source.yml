name: Publish application files
on:
  push:
    paths: ['.github/workflows/source.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified application source
        shell: python
        run: |
          import base64, hashlib, io, re, zipfile
          from pathlib import Path
          text = Path('.github/workflows/publish.yml').read_text()
          data = base64.b64decode(re.search(r'base64.b64decode\("([^"\n]+)"\)', text).group(1))
          assert hashlib.sha256(data).hexdigest() == 'ee2cd678305e089fdd3694216422e68ded9997f410d03a5c0d2e67ecb01ccd67'
          archive = zipfile.ZipFile(io.BytesIO(data))
          for entry in archive.infolist():
              if not entry.filename.startswith('.github/'):
                  archive.extract(entry, '.')
      - name: Commit application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore backend desktop docs frontend render.yaml
          git commit -m 'Publish tested Nova web application and original desktop source'
          git push
