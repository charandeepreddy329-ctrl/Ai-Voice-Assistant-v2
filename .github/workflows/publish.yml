name: Publish verified Nova source
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'charandeepreddy329-ctrl/Ai-Voice-Assistant-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source archive
        shell: python
        run: |
          import base64, hashlib, io, zipfile
          from pathlib import Path
          data = base64.b64decode("")
          assert hashlib.sha256(data).hexdigest() == "ee2cd678305e089fdd3694216422e68ded9997f410d03a5c0d2e67ecb01ccd67"
          zipfile.ZipFile(io.BytesIO(data)).extractall('.')
          Path('.github/workflows/publish.yml').unlink()
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r requirements-dev.txt && python -m pytest -q
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: desktop
      - name: Publish application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish tested Nova 3D frontend, Python API, original desktop source and docs"
          git push
